model:
  name: dcmh
  bit_dim: 64
  gamma: 1.0
  eta: 1.0
  # MLP on BOW (paper default); set null for HF transformer
  text_feature_dim: 1386
  # only used when text_feature_dim is null
  freeze_text_encoder: false
  backbone:
    image: "alexnet"              # alexnet (paper default) or resnet50
    text: "MLP" # only used when text_feature_dim is null

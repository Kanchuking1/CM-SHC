# Anchored DCMH @ 128 bits on MIR-Flickr-25k, CLIP ViT-B/32 + LoRA.
#
# λ-sweep follow-up.  λ=1.0 is the "equal weight" condition: anchor
# contribution matches pair + quant + balance.  This is the strongest
# anchor pressure we can apply without explicitly zeroing the pair loss
# (see *_anchoronly.yaml for that).
model:
  name: dcmh_anchored_clip_lora
  bit_dim: 128
  lambda_center: 1.0

dataset: mirflickr25k

experiment_name: dcmh_anchored_clip_lora_mirflickr25k_128bit_lc10

training:
  max_epochs: 200
  batch_size: 64
  optimizer: adamw
  lr_img: 5.0e-5
  lr_txt: 5.0e-5
  weight_decay: 0.01
  betas: [0.9, 0.999]
  eps: 1.0e-8

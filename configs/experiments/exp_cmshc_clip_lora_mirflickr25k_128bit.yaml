# CM-SHC @ 128 bits on MIR-Flickr-25k with CLIP ViT-B/32 + LoRA.
#
# This is the "flagship" CLIP experiment: end-to-end adapter-tuning on
# top of frozen CLIP, with the full CM-SHC joint loss and
# classifier-derived semantic hash centers.
model:
  name: cm_shc_clip_lora
  bit_dim: 128
  similarity_method: classifier

dataset: mirflickr25k

experiment_name: cmshc_clip_lora_mirflickr25k_128bit

training:
  max_epochs: 200
  batch_size: 64
  optimizer: adamw
  lr_img: 5.0e-5
  lr_txt: 5.0e-5
  weight_decay: 0.01
  betas: [0.9, 0.999]
  eps: 1.0e-8

# DCMH @ 128 bits on MIR-Flickr-25k with CLIP ViT-B/32 + LoRA adapters.
#
# Trainable: LoRA adapters on q/k/v projections in every attention sub-
# module, plus the two hash heads.  AdamW + small LR is the standard
# fine-tuning recipe for this setup.
model:
  name: dcmh_clip_lora
  bit_dim: 128

dataset: mirflickr25k

experiment_name: dcmh_clip_lora_mirflickr25k_128bit

training:
  max_epochs: 200
  batch_size: 64
  optimizer: adamw
  lr_img: 5.0e-5
  lr_txt: 5.0e-5
  weight_decay: 0.01
  betas: [0.9, 0.999]
  eps: 1.0e-8

# CM-SHC @ 128 bits on MIR-Flickr-25k, ablation: S built from label
# co-occurrence (cheap, no auxiliary classifier).
model:
  name: cm_shc
  bit_dim: 128
  similarity_method: cooccurrence

dataset: mirflickr25k

experiment_name: cmshc_mirflickr25k_128bit_cooc

training:
  max_epochs: 200
  batch_size: 64

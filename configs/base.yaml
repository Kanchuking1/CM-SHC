# Shared defaults for all experiments (merge order: base → model → dataset → experiment).
seed: 42
device: cuda

paths:
  # Relative to repo root; holds HF snapshots and TORCH_HOME for torchvision weights.
  model_cache: model_cache
  # If true, load HF/tokenizers with local_files_only (HPC / no Hub access).
  offline_mode: true

output:
  root: experiments
  checkpoints: checkpoints
  logs: logs
  results: results

training:
  batch_size: 32
  num_workers: 4
  save_every: 1
  max_epochs: 500
  # If true, resume from latest epoch_*.pt under the experiment run dir when present.
  resume: true
  # 10**(-1.5) ≈ 0.0316
  lr_img: 0.0316
  lr_txt: 0.0316
